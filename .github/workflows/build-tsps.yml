name: Build PPSSPPSDL_SmartProS

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ppsspp_version:
        description: 'PPSSPP ref (branch or tag) in PPSSPP_REPO'
        default: 'save-on-exit-v1.20.3'
  workflow_call:
    inputs:
      ppsspp_version:
        type: string
        default: 'save-on-exit-v1.20.3'

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set image name (GHCR requires lowercase)
        run: echo "IMAGE=ghcr.io/${OWNER,,}/ppsspp-builder-tsps" >> "$GITHUB_ENV"
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Ensure beta release exists
        if: github.event_name != 'pull_request' && github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="beta-${{ github.ref_name }}"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" \
              --target "${{ github.ref_name }}" \
              --title "Beta Build (${{ github.ref_name }})" \
              --prerelease \
              --notes "PPSSPP binaries built from ${{ github.ref_name }}" \
            || true

      - name: Download SDK tarball from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p toolchains/smartpro_s
          gh release download sdk-toolchains \
            --repo spruceUI/PPSSPP-spruce \
            -p "sdk_tg5050_linux_v1.0.0.tgz" \
            -D toolchains/smartpro_s/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.tsps
          push: true
          tags: ${{ env.IMAGE }}:latest
          cache-from: type=registry,ref=${{ env.IMAGE }}:cache
          cache-to: type=registry,ref=${{ env.IMAGE }}:cache,mode=max

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ccache
          key: ccache-tsps-${{ github.event.inputs.ppsspp_version || 'save-on-exit-v1.20.3' }}-${{ github.sha }}
          restore-keys: |
            ccache-tsps-${{ github.event.inputs.ppsspp_version || 'save-on-exit-v1.20.3' }}-
            ccache-tsps-

      - name: Build PPSSPP
        run: |
          mkdir -p output ccache
          docker run --rm \
            -e PPSSPP_VERSION=${{ github.event.inputs.ppsspp_version || 'save-on-exit-v1.20.3' }} \
            -v ${{ github.workspace }}/output:/output \
            -v ${{ github.workspace }}/ccache:/ccache \
            ${{ env.IMAGE }}:latest

      - name: Upload binary and assets
        if: github.event_name != 'pull_request' && github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "beta-${{ github.ref_name }}" output/PPSSPPSDL_SmartProS --clobber

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PPSSPPSDL_SmartProS
          path: output/PPSSPPSDL_SmartProS
          if-no-files-found: error
